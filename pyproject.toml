[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-financial-pipeline"
version = "1.0.0"
description = "Pipeline orientado a eventos com deduplicacao, watermark e replay."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

